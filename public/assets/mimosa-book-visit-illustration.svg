<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" fill="none">
  <defs>
    <!-- Halo radial de fond -->
    <radialGradient id="bgGlow" cx="50%" cy="68%" r="52%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.78" />
      <stop offset="55%" stop-color="#F5EFEA" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#E6DDD5" stop-opacity="0" />
    </radialGradient>

    <!-- Corps 3D de la carte agenda principale -->
    <linearGradient id="cardSurface" x1="180" y1="54" x2="500" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDFB" />
      <stop offset="52%" stop-color="#F7F1EB" />
      <stop offset="100%" stop-color="#EAE0D7" />
    </linearGradient>

    <!-- Tranche 3D latérale/inférieure -->
    <linearGradient id="cardEdge" x1="180" y1="60" x2="500" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D7C9BD" />
      <stop offset="100%" stop-color="#B5A192" />
    </linearGradient>

    <!-- Barre d'en-tête bronze/travertin -->
    <linearGradient id="headerBar" x1="200" y1="68" x2="480" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B493C" />
      <stop offset="100%" stop-color="#3E3128" />
    </linearGradient>

    <!-- Accent or/champagne -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9BC96" />
      <stop offset="50%" stop-color="#B9966B" />
      <stop offset="100%" stop-color="#8F6F48" />
    </linearGradient>

    <!-- Créneau sélectionné -->
    <linearGradient id="activeSlot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#755E4E" />
      <stop offset="100%" stop-color="#4E3D31" />
    </linearGradient>

    <!-- Carte flottante horloge / confirmation -->
    <linearGradient id="floatingGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#F4ECE4" stop-opacity="0.92" />
    </linearGradient>

    <!-- Ombres portées douces 3D -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2B211A" flood-opacity="0.14" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B211A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Halo lumineux arrière -->
  <ellipse cx="340" cy="260" rx="290" ry="180" fill="url(#bgGlow)" />

  <!-- Arcs architecturaux fins en arrière-plan -->
  <path d="M 96 380 A 244 244 0 0 1 584 380" stroke="#8F7868" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="5 5" />
  <path d="M 142 380 A 198 198 0 0 1 538 380" stroke="#8F7868" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Branche botanique Mimosa minimaliste à gauche -->
  <g opacity="0.85">
    <path d="M 168 375 C 148 318, 126 264, 96 220" stroke="#8F7868" stroke-width="2" stroke-linecap="round" />
    <path d="M 136 298 C 114 290, 98 278, 86 262" stroke="#8F7868" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 150 328 C 132 332, 114 326, 102 314" stroke="#8F7868" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="94" cy="216" r="8" fill="url(#goldAccent)" />
    <circle cx="114" cy="234" r="6.5" fill="url(#goldAccent)" opacity="0.9" />
    <circle cx="84" cy="260" r="7" fill="url(#goldAccent)" opacity="0.85" />
    <circle cx="122" cy="272" r="5.5" fill="url(#goldAccent)" opacity="0.75" />
    <circle cx="100" cy="312" r="6.5" fill="url(#goldAccent)" opacity="0.85" />
  </g>

  <!-- Branche botanique Mimosa minimaliste à droite -->
  <g opacity="0.85">
    <path d="M 512 375 C 532 318, 554 264, 584 220" stroke="#8F7868" stroke-width="2" stroke-linecap="round" />
    <path d="M 544 298 C 566 290, 582 278, 594 262" stroke="#8F7868" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="586" cy="216" r="8" fill="url(#goldAccent)" />
    <circle cx="566" cy="234" r="6.5" fill="url(#goldAccent)" opacity="0.9" />
    <circle cx="596" cy="260" r="7" fill="url(#goldAccent)" opacity="0.85" />
    <circle cx="558" cy="272" r="5.5" fill="url(#goldAccent)" opacity="0.75" />
  </g>

  <!-- Carte Agenda / Calendrier 3D principale émergeant du bas -->
  <g filter="url(#softShadow)">
    <!-- Épaisseur 3D de la carte -->
    <rect x="176" y="64" width="328" height="340" rx="28" fill="url(#cardEdge)" />
    <!-- Surface avant de la carte -->
    <rect x="176" y="56" width="328" height="340" rx="28" fill="url(#cardSurface)" stroke="#FFFFFF" stroke-width="2" />

    <!-- Anneaux de reliure calendrier 3D en or brossé -->
    <rect x="244" y="40" width="14" height="32" rx="7" fill="url(#goldAccent)" />
    <rect x="333" y="40" width="14" height="32" rx="7" fill="url(#goldAccent)" />
    <rect x="422" y="40" width="14" height="32" rx="7" fill="url(#goldAccent)" />

    <!-- En-tête du calendrier -->
    <path d="M 192 84 C 192 73, 201 64, 212 64 L 468 64 C 479 64, 488 73, 488 84 L 488 128 L 192 128 Z" fill="url(#headerBar)" />

    <!-- Petits indicateurs de navigation de mois dans l'en-tête -->
    <rect x="214" y="88" width="96" height="10" rx="5" fill="#F5EFEA" opacity="0.9" />
    <rect x="214" y="104" width="58" height="6" rx="3" fill="#D9BC96" opacity="0.75" />
    <circle cx="442" cy="96" r="11" fill="#FFFDFB" fill-opacity="0.14" />
    <path d="M 439 92 L 444 96 L 439 100" stroke="#F5EFEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="466" cy="96" r="11" fill="#FFFDFB" fill-opacity="0.14" />
    <path d="M 464 92 L 469 96 L 464 100" stroke="#F5EFEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Grille des jours & créneaux (3 lignes x 4 colonnes) -->
    <!-- Ligne 1 -->
    <rect x="202" y="150" width="60" height="46" rx="12" fill="#EFE7DF" />
    <rect x="218" y="169" width="28" height="7" rx="3.5" fill="#B5A192" />

    <rect x="274" y="150" width="60" height="46" rx="12" fill="#EFE7DF" />
    <rect x="290" y="169" width="28" height="7" rx="3.5" fill="#B5A192" />

    <rect x="346" y="150" width="60" height="46" rx="12" fill="#EFE7DF" />
    <rect x="362" y="169" width="28" height="7" rx="3.5" fill="#B5A192" />

    <rect x="418" y="150" width="60" height="46" rx="12" fill="#EFE7DF" />
    <rect x="434" y="169" width="28" height="7" rx="3.5" fill="#B5A192" />

    <!-- Ligne 2 (avec créneau sélectionné 3D en relief) -->
    <rect x="202" y="210" width="60" height="46" rx="12" fill="#EFE7DF" />
    <rect x="218" y="229" width="28" height="7" rx="3.5" fill="#B5A192" />

    <!-- Créneau sélectionné mis en avant -->
    <g filter="url(#cardShadow)">
      <rect x="270" y="206" width="68" height="54" rx="14" fill="url(#activeSlot)" stroke="#D9BC96" stroke-width="1.5" />
      <circle cx="304" cy="226" r="10" fill="url(#goldAccent)" />
      <path d="M 299.5 226 L 302.5 229 L 309 222.5" stroke="#FFFDFB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="286" y="243" width="36" height="5" rx="2.5" fill="#F5EFEA" opacity="0.9" />
    </g>

    <rect x="346" y="210" width="60" height="46" rx="12" fill="#EFE7DF" />
    <rect x="362" y="229" width="28" height="7" rx="3.5" fill="#B5A192" />

    <rect x="418" y="210" width="60" height="46" rx="12" fill="#EFE7DF" />
    <rect x="434" y="229" width="28" height="7" rx="3.5" fill="#B5A192" />

    <!-- Ligne 3 : Barre d'horaire confirmé -->
    <rect x="202" y="274" width="276" height="54" rx="16" fill="#F2EAE2" stroke="#DFD3C8" stroke-width="1.2" />
    <circle cx="230" cy="301" r="14" fill="url(#goldAccent)" opacity="0.22" />
    <circle cx="230" cy="301" r="6" fill="#6E5747" />
    <rect x="256" y="291" width="118" height="8" rx="4" fill="#5B493C" />
    <rect x="256" y="305" width="76" height="6" rx="3" fill="#9E8979" />
    <rect x="408" y="289" width="54" height="24" rx="12" fill="#5B493C" />
    <rect x="421" y="298" width="28" height="6" rx="3" fill="#FFFDFB" />
  </g>

  <!-- Cadran Horloge 3D flottant à gauche -->
  <g filter="url(#cardShadow)">
    <circle cx="156" cy="176" r="46" fill="url(#floatingGlass)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="156" cy="176" r="36" stroke="#D8C9BC" stroke-width="1.2" stroke-dasharray="3 4" />
    <!-- Aiguilles -->
    <path d="M 156 176 L 156 154" stroke="#4E3D31" stroke-width="3" stroke-linecap="round" />
    <path d="M 156 176 L 173 184" stroke="#B9966B" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="156" cy="176" r="4" fill="#4E3D31" />
  </g>

  <!-- Badge 3D Confirmation / Check flottant à droite -->
  <g filter="url(#cardShadow)">
    <rect x="470" y="156" width="126" height="58" rx="29" fill="url(#floatingGlass)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="500" cy="185" r="18" fill="url(#goldAccent)" />
    <path d="M 493 185 L 498 190 L 508 179" stroke="#FFFDFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="526" y="177" width="48" height="7" rx="3.5" fill="#4E3D31" />
    <rect x="526" y="189" width="32" height="5" rx="2.5" fill="#9E8979" />
  </g>
</svg>
